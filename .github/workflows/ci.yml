name: CI

on:
  pull_request:
  push:
    branches: [master]

# Um push novo na mesma branch cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # O type-check do next build ignora *.test.* e *.spec.*, e o Vitest não checa tipos:
      # o tsc cobre o projeto inteiro, testes unitários e specs E2E inclusive
      - run: npm run typecheck
      - run: npm test
      # O build também roda a checagem de tipos do TypeScript (só do código do app)
      - run: npm run build

  stories:
    name: Stories (Storybook + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stories
      # Story instável passava numa rodada só e falhava no master (ENG-127). Repetir as stories
      # alteradas pelo PR pega a instabilidade no PR dela. O Vitest 4 só tem `repeats` por teste
      # (as stories viram testes pelo plugin do Storybook, sem esse controle), por isso o loop.
      # O checkout do PR é o merge com a base: o diff contra a ponta da base é o que o PR muda.
      - name: Repetir 5x as stories alteradas pelo PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mapfile -t changed < <(git diff --name-only --diff-filter=d FETCH_HEAD HEAD -- '*.stories.tsx')
          if [ ${#changed[@]} -eq 0 ]; then
            echo "Nenhuma story alterada pelo PR."
            exit 0
          fi
          printf 'Stories alteradas:\n'; printf '  %s\n' "${changed[@]}"
          for run in 1 2 3 4 5; do
            echo "::group::Rodada $run de 5"
            npx vitest run --project storybook "${changed[@]}"
            echo "::endgroup::"
            echo "Rodada $run de 5: verde"
          done

  # Fluxos de auth de ponta a ponta contra um Supabase local: agentes sem Docker validam por aqui.
  # Como o banco sobe do zero, o job também prova que as migrations recriam o schema inteiro.
  e2e:
    name: E2E (Playwright + Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Versão fixa: toda rodada usa o mesmo CLI e as mesmas imagens. Como atualizar: GIT_WORKFLOW.md > CI
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      # Sobe só o que os fluxos usam (banco, Auth, REST, Storage, gateway e Mailpit).
      # O `toomanyrequests` do public.ecr.aws no log é esperado: o CLI baixa as imagens em paralelo,
      # tenta de novo e, se o ECR seguir recusando, cai para o ghcr.io e o Docker Hub. Cache das
      # imagens não compensa: salvar e restaurar alguns GB custa mais que os ~45s do download.
      - run: supabase start -x studio,postgres-meta,realtime,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Apontar app e testes para o Supabase local
        run: |
          bash scripts/supabase-e2e-env.sh > "$RUNNER_TEMP/e2e.env"
          # A secret key é a de dev do Supabase local e só vale dentro do runner, mas o log é
          # público e o GitHub imprime as env de cada passo: mascarada, aparece como ***
          echo "::add-mask::$(grep '^E2E_SUPABASE_SECRET_KEY=' "$RUNNER_TEMP/e2e.env" | cut -d= -f2-)"
          cat "$RUNNER_TEMP/e2e.env" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build com as variáveis do Supabase local: as NEXT_PUBLIC_* são embutidas no build
      - run: npm run build
      - run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
